<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which witch are you?</title>
<style>
  :root {
    --bg: #f7f5f0; --card: #ffffff; --text: #1f1d1a; --muted: #6b6760; --border: #dcd8cf;
    --accent: #5b4bb7; --accent-soft: #eeedfe; --danger: #a32d2d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514; --card: #201f1d; --text: #ecebe6; --muted: #a09d95; --border: #3a3834;
      --accent: #afa9ec; --accent-soft: #2a2650; --danger: #f09595;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font: 500 30px/1.2 Georgia, serif; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); margin: 0 0 2rem; }
  .hint { color: var(--muted); font-size: 14px; margin: -0.5rem 0 1rem; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width 0.25s; }
  h2 { font: 500 22px/1.3 Georgia, serif; margin: 1.75rem 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .list { display: grid; gap: 8px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .option { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  .option:hover { border-color: var(--muted); }
  .option.selected { outline: 3px solid var(--accent); border-color: transparent; background: var(--accent-soft); }
  .photo-option { flex-direction: column; align-items: stretch; padding: 0; overflow: hidden; gap: 0; }
  .photo-option img, .photo-option .no-photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--border); }
  .photo-option .no-photo { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .photo-option span { padding: 10px 12px; font-size: 14px; }
  .swatches { display: flex; gap: 0; width: 72px; height: 32px; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .swatches i { flex: 1; }
  .error { color: var(--danger); font-size: 14px; min-height: 22px; margin: 10px 0 0; }
  .nav { display: flex; justify-content: space-between; margin-top: 6px; }
  .nav button, .actions button { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
  .nav button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .result-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .result-card img { width: 100%; height: 260px; object-fit: cover; display: block; }
  .result-body { padding: 1.25rem 1.5rem 1.5rem; }
  .result-body .eyebrow { color: var(--muted); font-size: 14px; margin: 0; }
  .result-body h2 { margin: 0.25rem 0 0.75rem; font-size: 30px; }
  .result-body p { margin: 0; font-family: Georgia, serif; font-size: 17px; }
  .runner { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; font-size: 15px; }
  .runner .name { width: 170px; }
  .runner .bar { flex: 1; height: 8px; }
  .runner .score { width: 28px; text-align: right; color: var(--muted); font-size: 13px; }
  .actions { margin-top: 1.5rem; }
  details { margin-top: 3rem; font-size: 13px; color: var(--muted); }
  details li { margin-bottom: 4px; }
  details a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Which witch are you?</h1>
  <p class="subtitle">13 questions about what you like. None of them are about magic.</p>

  <section id="quiz">
    <div class="progress-labels"><span id="count"></span><span id="percent"></span></div>
    <div class="bar"><div id="progress"></div></div>
    <h2 id="question"></h2>
    <p class="hint" id="hint" hidden></p>
    <div id="options"></div>
    <p class="error" id="error" role="alert"></p>
    <div class="nav">
      <button id="back">← Back</button>
      <button id="next" class="primary">Next →</button>
    </div>
  </section>

  <section id="result" hidden></section>

  <details>
    <summary>Photo credits</summary>
    <p>All photos are from Wikimedia Commons under the licences shown.</p>
    <ul id="credits"></ul>
  </details>
</main>

// One array of picked option indexes per question; most questions allow one pick, some set `pick`
const answers = QUESTIONS.map(() => []);
const picksAllowed = (question) => question.pick || 1;
let currentIndex = 0;
const byId = (id) => document.getElementById(id);

function makeImage(photoKey, altText) {
  const image = document.createElement("img");
  image.src = PHOTOS[photoKey].thumb;
  image.alt = altText;
  image.loading = "lazy";
  return image;
}

function buildOption(question, option, optionIndex) {
  const [label, visual] = option;
  const button = document.createElement("button");
  const isSelected = answers[currentIndex].includes(optionIndex);
  button.className = "option" + (isSelected ? " selected" : "");
  button.setAttribute("aria-pressed", isSelected);

  if (question.style === "photo") {
    button.classList.add("photo-option");
    if (visual) {
      button.appendChild(makeImage(visual, label));
    } else {
      // Deliberately blank tile: the answer is "nothing much"
      const blankTile = document.createElement("div");
      blankTile.className = "no-photo";
      blankTile.textContent = "(empty)";
      button.appendChild(blankTile);
    }
  } else if (question.style === "swatch") {
    const swatchStrip = document.createElement("div");
    swatchStrip.className = "swatches";
    visual.forEach((colour) => {
      const swatch = document.createElement("i");
      swatch.style.background = colour;
      swatchStrip.appendChild(swatch);
    });
    button.appendChild(swatchStrip);
  }

  const caption = document.createElement("span");
  caption.textContent = label;
  button.appendChild(caption);

  button.addEventListener("click", () => {
    const picked = answers[currentIndex];
    const limit = picksAllowed(question);
    if (limit === 1) {
      answers[currentIndex] = [optionIndex];
    } else if (picked.includes(optionIndex)) {
      picked.splice(picked.indexOf(optionIndex), 1);
    } else if (picked.length >= limit) {
      byId("error").textContent = `You've picked ${limit}. Tap one to unpick it first.`;
      return;
    } else {
      picked.push(optionIndex);
    }
    byId("error").textContent = "";
    renderQuestion();
  });
  return button;
}

function renderQuestion() {
  const question = QUESTIONS[currentIndex];
  const percentComplete = Math.round((currentIndex / QUESTIONS.length) * 100);
  byId("count").textContent = `Question ${currentIndex + 1} of ${QUESTIONS.length}`;
  byId("percent").textContent = `${percentComplete}%`;
  byId("progress").style.width = `${percentComplete}%`;
  byId("question").textContent = question.text;
  byId("error").textContent = "";

  const hint = byId("hint");
  hint.hidden = picksAllowed(question) === 1;
  hint.textContent = `Pick ${picksAllowed(question)} (${answers[currentIndex].length} picked)`;

  const optionsContainer = byId("options");
  optionsContainer.className = question.style === "photo" ? "grid" : "list";
  optionsContainer.replaceChildren(...question.options.map((option, optionIndex) => buildOption(question, option, optionIndex)));

  byId("back").style.visibility = currentIndex === 0 ? "hidden" : "visible";
  byId("next").textContent = currentIndex === QUESTIONS.length - 1 ? "See my result" : "Next →";
}

function tallyScores() {
  const scores = Object.fromEntries(Object.keys(WITCH_TYPES).map((typeKey) => [typeKey, 0]));
  answers.forEach((pickedIndexes, questionIndex) => {
    const question = QUESTIONS[questionIndex];
    const isMultiPick = picksAllowed(question) > 1;
    pickedIndexes.forEach((optionIndex) => {
      const points = question.options[optionIndex][2];
      // Multi-pick answers give 1 point per type, so one question with 3 picks doesn't outweigh the rest
      Object.entries(points).forEach(([typeKey, value]) => { scores[typeKey] += isMultiPick ? 1 : value; });
    });
  });
  return Object.entries(scores).sort((first, second) => second[1] - first[1]);
}

function renderResult() {
  const rankedTypes = tallyScores();
  const [topKey, topScore] = rankedTypes[0];
  const [topName, topPhoto, topDescription] = WITCH_TYPES[topKey];

  const card = document.createElement("div");
  card.className = "result-card";
  card.appendChild(makeImage(topPhoto, topName));
  const body = document.createElement("div");
  body.className = "result-body";
  body.innerHTML = '<p class="eyebrow">You are a…</p><h2></h2><p></p>';
  body.querySelector("h2").textContent = topName;
  body.querySelector("p:last-child").textContent = topDescription;
  card.appendChild(body);

  const runnersHeading = document.createElement("h2");
  runnersHeading.textContent = "Your next closest matches";
  runnersHeading.style.fontSize = "18px";

  const runnerRows = rankedTypes.slice(1, 5).map(([typeKey, score]) => {
    const row = document.createElement("div");
    row.className = "runner";
    row.innerHTML = '<span class="name"></span><div class="bar"><div></div></div><span class="score"></span>';
    row.querySelector(".name").textContent = WITCH_TYPES[typeKey][0];
    row.querySelector(".bar > div").style.width = `${Math.round((score / topScore) * 100)}%`;
    row.querySelector(".score").textContent = score;
    return row;
  });

  const actions = document.createElement("div");
  actions.className = "actions";
  const retakeButton = document.createElement("button");
  retakeButton.textContent = "Retake the quiz";
  retakeButton.addEventListener("click", () => {
    answers.forEach((pickedIndexes) => pickedIndexes.splice(0));
    currentIndex = 0;
    byId("result").hidden = true;
    byId("quiz").hidden = false;
    renderQuestion();
  });
  actions.appendChild(retakeButton);

  byId("result").replaceChildren(card, runnersHeading, ...runnerRows, actions);
  byId("quiz").hidden = true;
  byId("result").hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderCredits() {
  // Built with textContent because artist names come from Commons, not from this file
  const creditItems = Object.values(PHOTOS).map((photo) => {
    const item = document.createElement("li");
    const link = document.createElement("a");
    link.href = photo.page;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = photo.title.replace(/^File:/, "");
    item.append(link, ` by ${photo.artist || "unknown"} (${photo.license || "see source"})`);
    return item;
  });
  byId("credits").replaceChildren(...creditItems);
}

byId("next").addEventListener("click", () => {
  const limit = picksAllowed(QUESTIONS[currentIndex]);
  if (answers[currentIndex].length < limit) {
    byId("error").textContent = limit === 1 ? "Pick an answer first." : `Pick ${limit} answers first.`;
    return;
  }
  if (currentIndex < QUESTIONS.length - 1) {
    currentIndex += 1;
    renderQuestion();
    window.scrollTo({ top: 0 });
  } else {
    renderResult();
  }
});
byId("back").addEventListener("click", () => {
  if (currentIndex > 0) {
    currentIndex -= 1;
    renderQuestion();
  }
});

renderCredits();
renderQuestion();
</script>
